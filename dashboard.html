<!DOCTYPE html>
<html>
<head>
  <title>Auric Ember Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🕯️ Auric Ember</h1>
<h2>Customer Dashboard</h2>

<p id="welcome">Welcome!</p>

<button onclick="location.href='profile.html'">👤 My Profile</button>
<br><br>

<button onclick="location.href='orders.html'">📦 My Orders</button>
<br><br>

<button onclick="location.href='wishlist.html'">❤️ Wishlist</button>
<br><br>

<button onclick="location.href='addresses.html'">📍 Saved Addresses</button>
<br><br>

<button onclick="location.href='loyalty.html'">🎁 Loyalty Points</button>
<br><br>

<button id="logout">🚪 Logout</button>

<script type="module" src="dashboard.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_AUTH_DOMAIN",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_STORAGE_BUCKET",
  messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
  appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

onAuthStateChanged(auth, (user) => {
  if (user) {
    // User is logged in
    console.log("User:", user.email);
  } else {
    // User is not logged in
    window.location.href = "index.html";
  }
});

// Optional logout button
const logoutBtn = document.getElementById("logout");

if (logoutBtn) {
  logoutBtn.onclick = () => {
    signOut(auth).then(() => {
      window.location.href = "index.html";
    });
  };
}
</script>
</body>
</html>
