<!DOCTYPE html>
<html>
<head>
<title>Auric Ember - My Account</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial, sans-serif;
  background:#f8f5f0;
  margin:0;
}

.header {
  background:#3b2a20;
  color:white;
  padding:20px;
  text-align:center;
}

.card {
  background:white;
  margin:20px;
  padding:20px;
  border-radius:15px;
  box-shadow:0 2px 8px #ccc;
}

button {
  background:#3b2a20;
  color:white;
  border:none;
  padding:12px 20px;
  border-radius:8px;
  cursor:pointer;
}

.menu {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.menu div {
  background:#fff;
  padding:20px;
  text-align:center;
  border-radius:12px;
}
</style>

</head>

<body>

<div class="header">
<h1>Auric Ember</h1>
<p>My Account</p>
</div>


<div class="card">

<h2 id="userName">Welcome 👋</h2>

<p id="userEmail"></p>

<p id="points">Reward Points: 0</p>

</div>


<div class="card">
<h3>Account Options</h3>

<div class="menu">

<div>
<h4>🛍 Orders</h4>
<p>View your orders</p>
</div>

<div>
<h4>❤️ Wishlist</h4>
<p>Your saved candles</p>
</div>

<div>
<h4>🎁 Rewards</h4>
<p>Cashback & points</p>
</div>

<div>
<h4>📍 Address</h4>
<p>Manage delivery address</p>
</div>

</div>

</div>


<div class="card">
<button id="logout">Logout</button>
</div>


<script type="module">

import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import { getAuth, onAuthStateChanged, signOut } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import { getFirestore, doc, getDoc } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig={apiKey:"AIzaSyBdqq63eP_zc6UWjc5sSVRdwjoUnUzPYT4",authDomain:"auricember.firebaseapp.com",projectId:"auricember",storageBucket:"auricember.firebasestorage.app",messagingSenderId:"568693145265",appId:"1:568693145265:web:de258d43d06ff35778ec90",measurementId:"G-E109YXWP1W"};



const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, async (user)=>{

 if(user){

   document.getElementById("userEmail").innerHTML =
   "Email: " + user.email;

   const userRef = doc(db,"users",user.uid);
   console.log("Logged UID:", user.uid);
   const userSnap = await getDoc(userRef);
   console.log("Document exists:", userSnap.exists());

   if(userSnap.exists()){

     const data = userSnap.data();

     document.getElementById("userName").innerHTML =
     "Welcome, " + data.name + " 👋";

     document.getElementById("points").innerHTML =
     "Reward Points: " + data.points;

   }

 }
 else{

   window.location.href="index.html";

 }

});


document.getElementById("logout").onclick=()=>{

signOut(auth).then(()=>{
window.location.href="index.html";
});

};


</script>

</body>
</html>
